# TAD — toolchain configuration.
#
# Provenance of every artifact this toolchain uses:
#   * Termux packages          -> `pkg install`            (termux-main repo)
#   * Android SDK components   -> dl.google.com via sdkmanager
#   * Gradle distribution      -> services.gradle.org      (official)
#   * AGP / Kotlin / AndroidX  -> Google Maven + Maven Central (via Gradle)
#
# There are no third-party repositories, prebuilt binaries, vendored tools,
# or community wrappers anywhere in this toolchain.

# --- Termux packages --------------------------------------------------------
JAVA_MAJOR=21                       # openjdk-21

# --- Android SDK (Google) ---------------------------------------------------
CMDLINE_TOOLS_BUILD=14742923        # commandlinetools-linux-<build>_latest.zip
# Android 17 (API 37.2). Recent AndroidX libraries are compiled against API 37
# and AGP 9 requires consumers to compile against 37+, so the minor level is part
# of the platform id (platforms;android-37.2).
COMPILE_SDK=37
COMPILE_SDK_MINOR=2
TARGET_SDK=37
MIN_SDK=26
BUILD_TOOLS=36.0.0

# --- Build plugins / libraries (Maven) --------------------------------------
GRADLE_VERSION=9.8.1
AGP_VERSION=9.4.1

# Kotlin must match the Kotlin Gradle plugin AGP bundles (AGP 9.4.1 -> KGP
# 2.2.10). AGP 9 compiles Kotlin itself ("built-in Kotlin"), so the only Kotlin
# plugin we declare is the Compose compiler, which must equal this version.
# To use a newer Kotlin, add kotlin-gradle-plugin to the root build script's
# buildscript classpath and bump this value to match — see README.
KOTLIN_VERSION=2.2.10
COMPOSE_BOM=2026.09.00
CORE_KTX=1.19.1
ACTIVITY_COMPOSE=1.13.0
LIFECYCLE=2.11.0
ESPRESSO=3.7.0
ANDROIDX_JUNIT=1.3.0
JUNIT=4.13.2

# --- Build tuning for on-device resources -----------------------------------
# Given ~1.5-2 GB free RAM on a phone, keep the JVM heap modest.
GRADLE_JVMARGS="-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

# --- adb --------------------------------------------------------------------
# Target the owner user explicitly: some OEM ROMs (e.g. TECNO "Dual Space")
# run a secondary user (999) that the shell user cannot enumerate.
ADB_USER=0
